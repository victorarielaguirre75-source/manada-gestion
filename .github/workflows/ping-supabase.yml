name: Ping Supabase (evitar pausa por inactividad)

on:
  schedule:
    # Se ejecuta 4 veces al día, cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escribir en Supabase para mantener el proyecto activo
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          curl -s -X PATCH \
            "https://btrffbgtyawifcnfdlqb.supabase.co/rest/v1/manada_data?id=eq.main" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"updated_at\": \"$NOW\"}"
